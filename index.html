<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学実験室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6; /* 薄いグレー */
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center m-0 font-sans">

    <div class="text-center p-10 bg-white rounded-3xl shadow-xl fade-in max-w-md w-full mx-4">
        <!-- タイトル -->
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-10">
            心理学実験室へようこそ
        </h1>

        <!-- ボタン -->
        <div class="flex flex-col items-center gap-6">
            <button 
                id="startBtn"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-10 rounded-full transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-300"
            >
                実験を開始する
            </button>

            <!-- メッセージ表示エリア -->
            <div id="displayArea" class="h-10 flex items-center justify-center">
                <p id="message" class="text-2xl font-bold text-red-600 opacity-0 transition-opacity duration-500">
                    Hello World!
                </p>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const message = document.getElementById('message');

        startBtn.addEventListener('click', () => {
            // アラートの代わりに、要素の透明度を変更して表示させる
            message.classList.remove('opacity-0');
            message.classList.add('opacity-100');
            
            // ボタンを一度無効化して、視覚的なフィードバックを強調する
            startBtn.textContent = '実験中...';
            startBtn.classList.replace('bg-blue-600', 'bg-gray-400');
            startBtn.disabled = true;
        });
    </script>
</body>
</html>
